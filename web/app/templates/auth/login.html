<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso — SISDAH HGUGM</title>
  <link rel="icon" href="{{ url_for('static', filename='SaludMadrid.png') }}" type="image/x-icon">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/sisdah.css') }}?v=15">
  <style>
    /* ══════════════════════════════════════════════════════════
       LOGIN v2 — Emil Kowalski + UI/UX Pro Max
       Principios aplicados:
       · scale(0.96) → scale(1): nada aparece de la nada
       · ease-out fuerte: cubic-bezier(0.23, 1, 0.32, 1)
       · Stagger 60ms entre elementos
       · Nunca ease-in, nunca transition:all
       · Blob drift: decorativo, lento (18-22s), reduced-motion off
       · Inputs sólidos: fondo #fff, sin transparencias
       · Tab pill: transform (GPU), no left/margin
       ══════════════════════════════════════════════════════════ */

    :root {
      --l-ease:   cubic-bezier(0.23, 1, 0.32, 1);
      --l-dur:    420ms;
    }

    /* Anular la animación global del card que viene del CSS base */
    .login-card { animation: none !important; }

    /* ── Fondo: blobs radiales con drift lento ─────────────── */
    .login-page {
      min-height: 100vh;
      background:
        radial-gradient(ellipse 65% 55% at 12% 8%,  rgba(200,16,46,.14) 0%, transparent 58%),
        radial-gradient(ellipse 50% 60% at 88% 92%,  rgba(0,48,135,.12)  0%, transparent 58%),
        radial-gradient(ellipse 35% 30% at 65% 20%,  rgba(200,16,46,.05) 0%, transparent 50%),
        radial-gradient(ellipse 40% 35% at 25% 80%,  rgba(0,48,135,.06)  0%, transparent 50%),
        #ECEEF4;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow: hidden;
      position: relative;
    }

    @keyframes blob-a {
      0%,100% { transform: translate(0,0) scale(1); }
      40%      { transform: translate(30px,-20px) scale(1.04); }
      70%      { transform: translate(-15px, 18px) scale(0.97); }
    }
    @keyframes blob-b {
      0%,100% { transform: translate(0,0) scale(1); }
      35%      { transform: translate(-25px, 15px) scale(1.03); }
      65%      { transform: translate(20px,-22px) scale(0.98); }
    }

    .login-page::before {
      content: '';
      position: fixed;
      inset: auto auto auto auto;
      width: 700px; height: 700px;
      top: -200px; left: -150px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, rgba(200,16,46,.09) 0%, transparent 65%);
      animation: blob-a 20s ease-in-out infinite;
      pointer-events: none;
    }
    .login-page::after {
      content: '';
      position: fixed;
      width: 600px; height: 600px;
      bottom: -150px; right: -120px;
      border-radius: 50%;
      background: radial-gradient(circle at 60% 60%, rgba(0,48,135,.09) 0%, transparent 65%);
      animation: blob-b 24s ease-in-out infinite;
      pointer-events: none;
    }

    /* ── Wrapper ───────────────────────────────────────────── */
    .login-wrap { width: 100%; max-width: 420px; position: relative; z-index: 1; }

    /* ── Card ──────────────────────────────────────────────── */
    .login-card {
      background: #fff;
      border: 1px solid rgba(0,0,0,.07);
      border-radius: 20px;
      box-shadow:
        0 0 0 1px rgba(0,0,0,.03),
        0 2px 4px rgba(0,0,0,.04),
        0 12px 28px -4px rgba(0,0,0,.12),
        0 32px 64px -16px rgba(0,0,0,.1);
      overflow: hidden;
    }
    .login-header-bar {
      background: linear-gradient(90deg, #C8102E 0%, #9E0C22 100%);
      height: 3px;
    }

    /* ── Branding ──────────────────────────────────────────── */
    .login-branding {
      text-align: center;
      padding: 2rem 2rem 1.25rem;
    }
    .login-branding .logo-cm {
      height: auto;
      max-height: 52px;
      max-width: 170px;
      object-fit: contain;
      margin-bottom: .9rem;
    }
    .login-branding h1 {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--gray-900);
      margin: 0 0 .1rem;
      line-height: 1.2;
    }
    .login-branding h1 em { font-style: normal; color: var(--cm-red); }
    .login-branding .sub {
      font-size: .78rem;
      color: var(--gray-500);
      margin: 0;
    }
    .login-branding .hosp {
      font-size: .7rem;
      color: var(--gray-400);
      margin: .1rem 0 0;
    }

    /* ── Segmented control (pill slide con transform GPU) ──── */
    .login-seg {
      display: flex;
      background: var(--gray-100);
      border-radius: 11px;
      padding: 3px;
      margin: 0 1.5rem 1.5rem;
      position: relative;
    }
    .login-seg-pill {
      position: absolute;
      inset: 3px auto 3px 3px;
      width: calc(50% - 3px);
      background: #fff;
      border-radius: 8px;
      box-shadow:
        0 1px 3px rgba(0,0,0,.10),
        0 1px 2px rgba(0,0,0,.06);
      /* Transform GPU — no layout, no paint */
      transition: transform 220ms var(--l-ease);
      pointer-events: none;
    }
    .login-seg-pill.to-right {
      transform: translateX(calc(100% + 3px));
    }
    .login-seg-btn {
      flex: 1;
      background: none;
      border: none;
      border-radius: 8px;
      padding: .5rem .6rem;
      font-size: .82rem;
      font-weight: 600;
      color: var(--gray-400);
      cursor: pointer;
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .35rem;
      /* color transition interruptible */
      transition: color 180ms var(--l-ease);
    }
    .login-seg-btn.active { color: var(--gray-900); }
    .login-seg-btn:focus-visible {
      outline: 2px solid var(--cm-red);
      outline-offset: -2px;
      border-radius: 8px;
    }

    /* ── Form body ─────────────────────────────────────────── */
    .login-body { padding: 0 1.5rem 2rem; }

    /* Inputs SÓLIDOS — sin ninguna transparencia */
    .login-body .form-control {
      background-color: #fff !important;
      border: 1.5px solid var(--gray-300) !important;
      border-radius: 10px;
      padding: .58rem .85rem;
      font-size: .9rem;
      color: var(--gray-900);
      box-shadow: none !important;
      transition:
        border-color 150ms var(--l-ease),
        box-shadow   180ms var(--l-ease);
    }
    .login-body .form-control:focus {
      border-color: var(--cm-red) !important;
      box-shadow: 0 0 0 3px rgba(200,16,46,.12) !important;
    }
    .login-body .form-control::placeholder { color: var(--gray-300); }

    /* DNI: monospace grande, centrado */
    .login-body .form-control.dni-input {
      text-align: center;
      font-family: 'Consolas','Courier New',monospace;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 5px;
    }

    /* Botón submit */
    .login-body .btn-cm-red {
      border-radius: 10px;
      padding: .65rem 1rem;
      font-size: .9rem;
      font-weight: 700;
      letter-spacing: .2px;
      width: 100%;
    }
    /* scale :active — Emil: feedback inmediato */
    .login-body .btn-cm-red:active { transform: scale(0.97); }

    /* Password eye */
    .btn-eye {
      position: absolute;
      right: .65rem; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: var(--gray-300);
      cursor: pointer; padding: .2rem .35rem;
      border-radius: 6px;
      line-height: 1;
      transition: color 130ms var(--l-ease);
    }
    .btn-eye:hover { color: var(--gray-500); }
    .btn-eye:focus-visible { outline: 2px solid var(--cm-red); outline-offset: 1px; }

    /* Form label */
    .login-body .form-label {
      font-size: .78rem;
      font-weight: 600;
      color: var(--gray-600);
      margin-bottom: .3rem;
    }

    /* Footer */
    .login-footer {
      text-align: center;
      color: var(--gray-400);
      font-size: .68rem;
      margin-top: 1.25rem;
      letter-spacing: .1px;
    }

    /* ── STAGGER ENTRANCE — Emil Kowalski ─────────────────────
       · scale(0.97) nunca scale(0)
       · translateY(14px): movimiento mínimo pero perceptible
       · ease-out fuerte: inicio inmediato
       · 60ms entre capas → cohesión sin lentitud
       ─────────────────────────────────────────────────────── */
    @keyframes l-fade-up {
      from { opacity: 0; transform: translateY(14px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0)    scale(1);    }
    }

    .l-anim { animation: l-fade-up var(--l-dur) var(--l-ease) both; }
    .l-d0  { animation-delay:   0ms; }
    .l-d1  { animation-delay:  70ms; }
    .l-d2  { animation-delay: 140ms; }
    .l-d3  { animation-delay: 210ms; }
    .l-d4  { animation-delay: 290ms; }

    /* prefers-reduced-motion: opacity solo, sin movimiento */
    @media (prefers-reduced-motion: reduce) {
      .login-page::before,
      .login-page::after { animation: none; }

      @keyframes l-fade-up {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      .l-anim { animation-duration: 200ms; }

      .login-seg-pill         { transition: none; }
      .login-body .form-control { transition: border-color 100ms linear; }
      .login-body .btn-cm-red:active { transform: none; }
      .dni-hint               { transition: opacity 150ms linear; }
    }
  </style>
</head>
<body class="login-page">

<div class="login-wrap">

  <!-- Card principal — capa 0 -->
  <div class="login-card l-anim l-d0">
    <div class="login-header-bar"></div>

    <!-- Branding — capa 1 -->
    <div class="login-branding l-anim l-d1">
      <img src="{{ url_for('static', filename='SaludMadrid.png') }}?v=2"
           class="logo-cm" alt="Comunidad de Madrid Salud">
      <h1><em>SISDAH</em></h1>
      <p class="sub">Sistema de Archivo Hospitalario</p>
      <p class="hosp">H.G.U. Gregorio Marañón · Informática</p>
    </div>

    <!-- Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} mx-3 mb-3 py-2 border-0 rounded-3" role="alert">
        <i class="bi bi-exclamation-circle me-1" aria-hidden="true"></i>{{ msg }}
      </div>
      {% endfor %}
    {% endwith %}

    <!-- Segmented tabs — capa 2 -->
    <div class="login-seg l-anim l-d2" role="tablist" aria-label="Tipo de acceso">
      <div class="login-seg-pill" id="seg-pill" aria-hidden="true"></div>
      <button class="login-seg-btn active" id="tab-tec" type="button"
              role="tab" aria-selected="true" aria-controls="form-tecnico"
              onclick="switchTab('tecnico')">
        <i class="bi bi-tools" aria-hidden="true"></i>Técnico
      </button>
      <button class="login-seg-btn" id="tab-ges" type="button"
              role="tab" aria-selected="false" aria-controls="form-gestor"
              onclick="switchTab('gestor')">
        <i class="bi bi-shield-lock" aria-hidden="true"></i>Gestor
      </button>
    </div>

    <!-- Form Técnico — capa 3 -->
    <div id="form-tecnico" class="login-body l-anim l-d3"
         role="tabpanel" aria-labelledby="tab-tec">
      <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="rol_tipo" value="tecnico">

        <div class="mb-4">
          <label class="form-label" for="dni_tecnico">DNI</label>
          <input type="text" id="dni_tecnico" name="dni_tecnico"
                 class="form-control dni-input"
                 placeholder="12345678A"
                 autocomplete="username"
                 autofocus
                 inputmode="text"
                 spellcheck="false"
                 maxlength="9"
                 oninput="this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')">
        </div>

        <button type="submit" class="btn btn-cm-red">
          <i class="bi bi-box-arrow-in-right me-2" aria-hidden="true"></i>Entrar
        </button>
      </form>
    </div>

    <!-- Form Gestor — capa 3 (mismo delay, intercambian) -->
    <div id="form-gestor" class="login-body d-none l-anim l-d3"
         role="tabpanel" aria-labelledby="tab-ges">
      <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="rol_tipo" value="gestor">

        <div class="mb-3">
          <label class="form-label" for="identificador">DNI o correo electrónico</label>
          <input type="text" id="identificador" name="identificador"
                 class="form-control"
                 placeholder="12345678A  o  usuario@hgugm.es"
                 autocomplete="username">
        </div>

        <div class="mb-4">
          <label class="form-label" for="password">Contraseña</label>
          <div class="position-relative">
            <input type="password" id="password" name="password"
                   class="form-control pe-5"
                   placeholder="••••••••"
                   autocomplete="current-password">
            <button type="button" class="btn-eye" id="btn-eye"
                    aria-label="Mostrar contraseña"
                    aria-pressed="false"
                    onclick="togglePassword()">
              <i class="bi bi-eye" id="eye-icon" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-cm-red">
          <i class="bi bi-box-arrow-in-right me-2" aria-hidden="true"></i>Acceder
        </button>
      </form>
    </div>
  </div><!-- /login-card -->

  <!-- Footer — capa 4 -->
  <p class="login-footer l-anim l-d4">
    SISDAH v3.0 · HGUGM Departamento de Informática · 2026
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* ─── Tab switch — pill deslizante (GPU transform) ──────────── */
function switchTab(tipo) {
  const isTec = tipo === 'tecnico';

  document.getElementById('form-tecnico').classList.toggle('d-none', !isTec);
  document.getElementById('form-gestor').classList.toggle('d-none',  isTec);

  const tabTec = document.getElementById('tab-tec');
  const tabGes = document.getElementById('tab-ges');
  tabTec.classList.toggle('active', isTec);
  tabTec.setAttribute('aria-selected', String(isTec));
  tabGes.classList.toggle('active', !isTec);
  tabGes.setAttribute('aria-selected', String(!isTec));

  /* Pill: translateX (GPU, sin layout change) */
  document.getElementById('seg-pill').classList.toggle('to-right', !isTec);

  /* Focus primer input del panel activo */
  const panel = document.getElementById(isTec ? 'form-tecnico' : 'form-gestor');
  const first = panel.querySelector('input:not([type=hidden])');
  if (first) setTimeout(() => first.focus(), 15);
}

/* ─── Password show/hide ─────────────────────────────────── */
function togglePassword() {
  const inp  = document.getElementById('password');
  const ico  = document.getElementById('eye-icon');
  const btn  = document.getElementById('btn-eye');
  const show = inp.type === 'password';
  inp.type   = show ? 'text' : 'password';
  ico.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
  btn.setAttribute('aria-label',   show ? 'Ocultar contraseña' : 'Mostrar contraseña');
  btn.setAttribute('aria-pressed', String(show));
}

</script>
</body>
</html>
