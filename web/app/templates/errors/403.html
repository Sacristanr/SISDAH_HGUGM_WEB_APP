{% extends "base.html" %}
{% block title %}Acceso restringido — SISDAH{% endblock %}
{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center" style="min-height:60vh">
  <div class="text-center">
    <i class="bi bi-shield-lock text-muted" style="font-size:4rem"></i>
    <h2 class="mt-3 fw-bold">Acceso restringido</h2>
    <p class="text-muted mb-4">No tienes permisos para ver <code>{{ request.path }}</code>.<br>
       Si crees que deberías tener acceso, contacta con un administrador.</p>
    <a href="{{ url_for('dashboard.home') }}" class="btn btn-cm-red">
      <i class="bi bi-house me-2"></i>Volver al inicio
    </a>
  </div>
</div>
{% endblock %}
